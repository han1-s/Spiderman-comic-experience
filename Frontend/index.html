<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homem-Aranha Superior</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- CAMADAS DE FUNDO -->
  <div class="bg-ny"></div>
  <div class="bg-overlay"></div>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="comic-container">
    
    <!-- PERSONAGEM PRINCIPAL -->
    <div class="spiderman-hero">
      <div class="speech-bubble">I AM THE SUPERIOR SPIDER-MAN!</div>
      <img src="assets/images/spiderman.png" alt="Homem-Aranha Superior">
    </div>

    <!-- MOSAICO DE HQS -->
    <div class="panel panel-1"><img src="assets/images/hq-01.jpg" alt="HQ 1"></div>
    <div class="panel panel-2"><img src="assets/images/hq-02.jpg" alt="HQ 2"></div>
    <div class="panel panel-3"><img src="assets/images/hq-03.jpg" alt="HQ 3"></div>
    <div class="panel panel-4"><img src="assets/images/hq-04.jpg" alt="HQ 4"></div>
    <div class="panel panel-5"><img src="assets/images/hq-05.jpg" alt="HQ 5"></div>
    <div class="panel panel-6"><img src="assets/images/hq-06.jpg" alt="HQ 6"></div>
    <div class="panel panel-7"><img src="assets/images/hq-07.jpg" alt="HQ 7"></div>
    <div class="panel panel-8"><img src="assets/images/hq-08.jpg" alt="HQ 8"></div>

  </main>

  <script src="js/script.js"></script>
</body>
</html>
